<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Donaciones</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />

    <link rel="icon" href="images/fav-ico-donacion.png" type="image/png">

    <style>
      body {
        background: #f4f6f9;
      }

      .card {
        border: none;
        border-radius: 20px;
      }

      .table thead {
        background: #dc3545;
        color: white;
      }

      .btn {
        border-radius: 12px;
      }

      .modal-content {
        border-radius: 20px;
      }

      .dataTables_filter input {
        border-radius: 10px;
        padding: 8px;
      }
    </style>
  </head>

  <body>

    <div class="container py-5">

      <div
        class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
      >

        <div>
          <h1 class="fw-bold text-danger">
            <i class="fa-solid fa-droplet"></i>
            Gestión de Donaciones
          </h1>
        </div>

        <div class="d-flex gap-2">

          <button
            class="btn btn-outline-danger px-4"
            onclick="window.location.href='index.html'"
          >
            <i class="fa-solid fa-arrow-left"></i>
            Volver
          </button>

          <button
            class="btn btn-danger px-4 shadow"
            onclick="window.location.href='registrar-donacion.html'"
          >
            <i class="fa-solid fa-plus"></i>
            Nueva Donación
          </button>

        </div>
      </div>


      <div class="card shadow-lg">

        <div class="card-body">

          <table
            id="tablaDonaciones"
            class="table table-hover table-bordered align-middle"
          >

            <thead class="text-center">

              <tr>

                <th>ID</th>

                <th>Donante</th>

                <th>Cantidad ML</th>

                <th>Fecha</th>

                <th>Observaciones</th>

                <th>Acciones</th>

              </tr>

            </thead>

            <tbody id="tbodyDonaciones"></tbody>

          </table>

        </div>

      </div>

    </div>

   

    <div
      class="modal fade"
      id="modalDetalle"
      tabindex="-1"
    >

      <div class="modal-dialog">

        <div class="modal-content">

          <div class="modal-header bg-info text-white">

            <h5 class="modal-title">
              Detalle Donación
            </h5>

            <button
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>

          </div>

          <div class="modal-body">

            <p>
              <strong>ID:</strong>
              <span id="detalleId"></span>
            </p>

            <p>
              <strong>Donante:</strong>
              <span id="detalleDonante"></span>
            </p>

            <p>
              <strong>Cantidad:</strong>
              <span id="detalleCantidad"></span>
            </p>

            <p>
              <strong>Fecha:</strong>
              <span id="detalleFecha"></span>
            </p>

            <p>
              <strong>Observaciones:</strong>
              <span id="detalleObservaciones"></span>
            </p>

          </div>

        </div>

      </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/tokenNotnull.js"></script>

    <script src="js/donaciones.js"></script>
    
    <script src="js/time-out-invalidate.js"></script>

  </body>
</html>
