<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Donante</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="images/fav-ico-donacion.png" type="image/png">
  </head>

  <body>
    <div class="container py-5">
      <div class="card shadow-lg">
        <div class="card-body p-4">
          <div
            class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
          >
            <h2 class="text-danger fw-bold m-0">Registrar Donante</h2>

            <button
              onclick="window.location.href = 'donantes.html'"
              class="btn btn-outline-danger px-4 shadow-sm"
            >
              ← Volver
            </button>
          </div>
          <form id="donanteForm" class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombres</label>
              <input type="text" class="form-control" id="nombres" required />
            </div>

            <div class="col-md-6">
              <label class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" required />
            </div>

            <div class="col-md-6">
              <label class="form-label">Documento</label>
              <input type="text" class="form-control" id="documento" required />
            </div>

            <div class="col-md-6">
              <label class="form-label">Fecha Nacimiento</label>
              <input
                type="date"
                class="form-control"
                id="fechaNacimiento"
                required
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Tipo de Sangre</label>
              <select id="tipoSangre" class="form-select">
                <option>O+</option>
                <option>O-</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Peso</label>
              <input type="number" class="form-control" id="peso" required />
            </div>

            <div class="col-md-6">
              <label class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="telefono" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Correo</label>
              <input type="email" class="form-control" id="correo" />
            </div>

            <div class="col-12">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="direccion" />
            </div>

            <div class="col-12 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="consentimiento"
              />
              <label class="form-check-label">
                Acepto consentimiento informado
              </label>
            </div>

            <div class="col-12">
              <label class="form-label fw-bold">Firma Consentimiento</label>

              <div class="d-flex gap-2 flex-wrap mb-3">
                <button
                  type="button"
                  id="modoDibujar"
                  class="btn btn-danger btn-sm"
                >
                  Dibujar Firma
                </button>

                <button
                  type="button"
                  id="modoSubir"
                  class="btn btn-outline-danger btn-sm"
                >
                  Subir Imagen
                </button>

                <button
                  type="button"
                  id="limpiarFirma"
                  class="btn btn-secondary btn-sm"
                >
                  Limpiar
                </button>
              </div>

              <div id="contenedorCanvas">
                <div class="border rounded p-2 bg-light">
                  <canvas
                    id="signatureCanvas"
                    style="
                      border: 1px solid #ccc;
                      width: 100%;
                      height: 220px;
                      touch-action: none;
                      cursor: crosshair;
                      background: white;
                      display: block;
                    "
                  ></canvas>
                </div>

                <small class="text-muted mt-2 d-block">
                  Firma con mouse o touch
                </small>
              </div>

              <div id="contenedorUpload" class="d-none">
                <input
                  type="file"
                  class="form-control"
                  id="firmaImagen"
                  accept="image/png,image/jpeg,image/jpg"
                />

                <small class="text-muted mt-2 d-block">
                  PNG o JPG máximo 2MB
                </small>
              </div>

              <div id="previewFirma" class="mt-3"></div>
            </div>

            <div class="col-12 text-center">
              <button class="btn btn-danger btn-lg w-100">
                Guardar Donante
              </button>
            </div>
          </form>

          <div id="mensaje" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script src="js/tokenNotnull.js"></script>

    <script src="js/registrar-donante.js"></script>

    <script src="js/time-out-invalidate.js"></script>

  </body>
</html>
