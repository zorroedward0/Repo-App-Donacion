<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registrar Donación</title>


    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="icon" href="images/fav-ico-donacion.png" type="image/png">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />


    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />

    <style>
      body {
        background: #f4f6f9;
      }

      .card {
        border: none;
        border-radius: 20px;
      }

      .form-control,
      .form-select {
        border-radius: 12px;
        padding: 12px;
      }

      .btn {
        border-radius: 12px;
      }

      textarea {
        resize: none;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-lg">
            <div class="card-body p-5">

              <div
                class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
              >
                <div>
                  <h2 class="text-danger fw-bold mb-1">
                    <i class="fa-solid fa-droplet"></i>
                    Registrar Donación
                  </h2>

                  <p class="text-muted mb-0">
                    Complete la información de la donación
                  </p>
                </div>

                <button
                  type="button"
                  onclick="window.location.href = 'donaciones.html'"
                  class="btn btn-outline-danger px-4 shadow-sm"
                >
                  <i class="fa-solid fa-arrow-left"></i>
                  Volver
                </button>
              </div>


              <form id="donacionForm" class="row g-4">

                <div class="col-md-6">
                  <label class="form-label fw-semibold">
                    <i class="fa-solid fa-user"></i>
                    Donante
                  </label>

                  <select class="form-select" id="donanteId" required>
                    <option value="">Seleccione un donante</option>
                  </select>
                </div>


                <div class="col-md-6">
                  <label class="form-label fw-semibold">
                    <i class="fa-solid fa-syringe"></i>
                    Cantidad (ML)
                  </label>

                  <input
                    type="number"
                    class="form-control"
                    id="cantidadML"
                    placeholder="Ej: 450"
                    required
                  />
                </div>


                <div class="col-12">
                  <label class="form-label fw-semibold">
                    <i class="fa-solid fa-note-sticky"></i>
                    Observaciones
                  </label>

                  <textarea
                    class="form-control"
                    id="observaciones"
                    rows="4"
                    placeholder="Ingrese observaciones adicionales..."
                  ></textarea>
                </div>


                <div class="col-12 mt-2">
                  <button
                    type="submit"
                    class="btn btn-danger btn-lg w-100 shadow"
                  >
                    <i class="fa-solid fa-floppy-disk"></i>
                    Registrar Donación
                  </button>
                </div>
              </form>


              <div id="mensaje" class="mt-4"></div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/tokenNotnull.js"></script>

    <script src="js/registrar-donacion.js"></script>

    <script src="js/time-out-invalidate.js"></script>

  </body>
</html>
