<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="images/fav-ico-donacion.png" type="image/png">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)),
                url('images/back_login_register.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        .side-image {
            position: absolute;
            top: 0;
            width: 320px;
            height: 100%;
            object-fit: cover;
            opacity: 0.25;
            filter: blur(1px);
        }

        .left {
            left: 0;
        }

        .right {
            right: 0;
        }

        .contenedor {
            perspective: 2000px;
        }

        .card {
            width: 100%;
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            color: white;
            overflow: hidden;
            transform-origin: left center;
            animation: entrada 1.6s cubic-bezier(.22, 1, .36, 1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        .card-body {
            padding: 50px;
        }

        h2 {
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-control {
            border: none;
            border-radius: 14px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.6);
        }

        .btn-danger {
            border-radius: 14px;
            padding: 14px;
            font-weight: bold;
            transition: 0.4s;
        }

        .btn-danger:hover {
            transform: scale(1.03);
        }

        a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: #d8e8ff;
        }

        @keyframes entrada {

            0% {
                opacity: 0;
                transform:
                    rotateY(-85deg) translateX(-250px) scale(0.9);
            }

            100% {
                opacity: 1;
                transform:
                    rotateY(0deg) translateX(0) scale(1);
            }
        }

        @keyframes pasarHoja {

            0% {
                opacity: 1;
                transform:
                    rotateY(0deg) translateX(0);
            }

            100% {
                opacity: 0;
                transform:
                    rotateY(-80deg) translateX(-500px);
            }
        }

        .pasando {
            animation: pasarHoja 2s cubic-bezier(.77, 0, .18, 1) forwards;
        }
    </style>

</head>

<body>

    <img class="side-image left" src="images/back_login_register.jpg">

    <img class="side-image right" src="images/back_login_register.jpg">

    <div class="container contenedor">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card" id="cardRegistro">

                    <div class="card-body text-center">

                        <h2>
                            Crear Cuenta
                        </h2>

                        <form id="registerForm">

                            <div class="mb-3">

                                <input type="text" id="username" class="form-control" placeholder="Usuario" required>

                            </div>

                            <div class="mb-4">

                                <input type="password" id="password" class="form-control" placeholder="Contraseña"
                                    required>

                            </div>

                            <button class="btn btn-danger w-100">
                                Registrarse
                            </button>

                        </form>

                        <div id="mensaje" class="mt-3"></div>

                        <div class="mt-4">

                            <a href="login.html" id="irLogin">
                                ¿Ya tienes cuenta? Inicia sesión
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        const link = document.getElementById("irLogin");
        const card = document.getElementById("cardRegistro");

        link.addEventListener("click", function (e) {

            e.preventDefault();

            card.classList.add("pasando");

            setTimeout(() => {

                window.location.href = link.href;

            }, 2000);

        });

    </script>

    <script src="js/register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</body>

</html>
